<template>
    <div class="slds-box slds-m-around_small backColor">
        <h2 class="slds-text-heading_small boxTitle">Search Results</h2>
        <div class="slds-grid slds-gutters slds-text-align_center">
            <div class="slds-col">
                <ul>
                    <li>Protected Leads: <lightning-button variant="base" name="protectedLeads" label={values.protectedLeadNumber} title={values.protectedLeadNumber} onclick={handleScrollToList} class="slds-m-left_x-small"></lightning-button></li>
                    <li>Protected Opps w/CO: <lightning-button variant="base" name="protectedOppsWithCO" label={values.protectedOppsCurrentOwnersNumber} title={values.protectedOppsCurrentOwnersNumber} onclick={handleScrollToList} class="slds-m-left_x-small"></lightning-button></li>
                    <li>Protected Opps: <lightning-button variant="base" name="protectedOpps" label={values.protectedOppsActivePipeNumber} title={values.protectedOppsActivePipeNumber} onclick={handleScrollToList} class="slds-m-left_x-small"></lightning-button></li>
                </ul>
            </div>
            <div class="slds-col">
                <ul>
                    <li>Matched Contacts: <lightning-button variant="base" name="matchedContacts" label={values.matchedContactNumber} title={values.matchedContactNumber} onclick={handleScrollToList} class="slds-m-left_x-small"></lightning-button></li>
                    <li>Unprotected Leads: <lightning-button variant="base" name="unprotectedLeads" label={values.unprotectedLeadsNumber} title={values.unprotectedLeadsNumber} onclick={handleScrollToList} class="slds-m-left_x-small"></lightning-button></li>
                    <li>Unprotected Opps: <lightning-button variant="base" name="unprotectedOpps" label={values.unprotectedOppsNumber} title={values.unprotectedOppsNumber} onclick={handleScrollToList} class="slds-m-left_x-small"></lightning-button></li>
                </ul>
            </div>
        </div>
    </div>
</template>
