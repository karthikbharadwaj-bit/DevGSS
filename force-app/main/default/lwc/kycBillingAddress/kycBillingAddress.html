<!-- Kyc Billing Address -->
<template>
    <div class="slds-grid slds-gutters slds-wrap">
        <div class="slds-col slds-size_6-of-12">
            <label class="slds-form-element__label">Billing Street</label>
            <lightning-helptext content="Street cannot be more than 150 symbols"></lightning-helptext>
            <lightning-input type="text"
                            variant="label-hidden"
                            placeholder="Street"
                            value={street}
                            data-id="billingStreet"
                            disabled={isFormLocked}
                            onchange={onChange}
                            maxlength="150">
            </lightning-input>
        </div>
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="Billing City"
                                 placeholder="City"
                                 value={city}
                                 data-id="billingCity"
                                 disabled={isFormLocked}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="Billing State"
                                 placeholder="State"
                                 value={state}
                                 data-id="billingState"
                                 disabled={isFormLocked}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="Billing Country"
                                 placeholder="Country"
                                 value={country}
                                 data-id="billingCountry"
                                 disabled={isFormLocked}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="Billing Postal Code"
                                 placeholder="PostalCode"
                                 value={postalCode}
                                 data-id="billingPostalCode"
                                 disabled={isFormLocked}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>
    </div>
</template>
