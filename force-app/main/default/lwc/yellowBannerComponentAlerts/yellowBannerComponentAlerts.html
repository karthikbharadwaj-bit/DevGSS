<template>
        <div
            class="slds-scoped-notification slds-media slds-media_center  alertStyle"
            role="status"
            if:true={isBTApproved}
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:warning"
                    alternative-text="Warning!"
                    variant="error"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p>This record is being managed by BT. Only the Carrier Sales Team should engage with this record.</p>
            </div>
        </div>

        <div
            class="slds-scoped-notification slds-media slds-media_center alertStyle"
            role="status"
            if:true={isDoNotDirectMail}
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Warning!"
                    variant="error"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p>Do not send direct mail to this person</p>
            </div>
        </div>

        <div
            class="slds-scoped-notification slds-media slds-media_center  alertStyle"
            role="status"
            if:true={isDoNotSms}
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Warning!"
                    variant="error"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p>Do not send SMS to this person</p>
            </div>
        </div>

        <div
            class="slds-scoped-notification slds-media slds-media_center alertStyle"
            role="status"
            if:true={noEmail}
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Warning!"
                    variant="error"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p>
                    <B>DO NOT EMAIL THIS PROSPECT:</B> This person has unsubscribed from Marketing emails and it is a
                    violation of privacy laws (i.e. it's illegal) to send them promotional messages.
                </p>
            </div>
        </div>

        <div
            class="slds-scoped-notification slds-media slds-media_center  alertStyle"
            role="status"
            if:true={isDoNotCall}
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Warning!"
                    variant="error"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p>
                    <B>DO NOT CALL THIS PROSPECT:</B> This person has requested to no longer be contacted via phone
                    call.
                </p>
            </div>
        </div>

        <div
            class="slds-scoped-notification slds-media slds-media_center alertStyle"
            role="status"
            if:true={domainType}
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:warning"
                    alternative-text="Warning!"
                    variant="error"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p><B>{domainType}</B></p>
            </div>
        </div>

        <div
            class="slds-scoped-notification slds-media slds-media_center alertStyle"
            role="status"
            if:true={isFreeTrialLead}
        >
            <div class="slds-media__figure">
                <lightning-icon
                    icon-name="utility:warning"
                    alternative-text="Warning!"
                    variant="error"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p><B>This is a Free Trial Lead</B></p>
            </div>
        </div>

        <div
            class="slds-scoped-notification slds-media slds-media_center alertStyle"
            role="status"
            if:true={showEmailMessage}
        >
            <div class="slds-media__figure">
                <lightning-icon
                icon-name="action:approval"
                size="x-small"
                ></lightning-icon>
            </div>
            <div class="slds-media__body">
                <p><B>{emailTitle}</B> {emailMessage}</p>
            </div>
        </div>
</template>
