<!-- 
*LWC Name           : relationshipSurveyScheduler
*Business Purpose 	: To input schedule dates for scheduling Relationship survey Invitation, view the existing scheduled jobs and abort selected scheduled jobs                

*Developer Name 	: Anjana Ravikumar
Modification History:
*--------------------------------------------------------------------------------------------------------------------
Date              User Story#                   Developer Name                    Changes done
*-------------------------------------------------------------------------------------------------------------------
03-16-2022         CRM-4977                      Anjana Ravikumar                   New LWC
-->
<template>
    <lightning-card>
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:event" alternative-text="schedule" title="schedule">
                    </lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">Schedule Relationship Survey Invitation</span>
                    </h2>
                </div>
            </header>
        </div>
        <!-- <div class="slds-card__body slds-card__body_inner"> -->
        <div class="slds-grid slds-gutters slds-m-around_small">
            <div class="slds-col slds-size_small">
                <lightning-input type="date" date-style="short" name="inputDate1" min={minDate}
                    label="Please enter the Schedule Dates" onchange={handleDateChange}>
                </lightning-input>
            </div>
            <!-- <div class="slds-col slds-size_small" style="margin-top: 6px;"> -->
            <div class="slds-col slds-size_small submit-btn">
                <button type="button" disabled={disableSubmitBtn} onclick={handleSubmit}
                    class="slds-button slds-m-top_medium slds-button_neutral">Schedule</button>

            </div>
        </div>
        <template if:true={result}>
            <div class="slds-grid slds-gutters slds-m-left_large slds-m-right_large">
                <span data-id="resultMsg" style="font-size: 0.75rem;">{result}</span>
            </div>
        </template>
        <template if:true={scheduleResult}>
            <!-- <template if:false={result}> -->
                <div class="slds-grid slds-gutters slds-m-left_large slds-m-right_large">
                    <span data-id="scheduleResultMsg" style="font-size: 0.75rem; color: red;">{scheduleResult}</span>
                </div>
            <!-- </template> -->
        </template>
        <template if:true={showDatesList}>
            <div class="slds-grid slds-gutters slds-m-around_small">
                <div class="slds-col">
                    <lightning-pill-container items={scheduleDatesToDisplay} onitemremove={handleDateRemove}
                        is-collapsible is-expanded="true"></lightning-pill-container>
                </div>
            </div>
        </template>
        <div class="slds-grid slds-gutters slds-m-left_large slds-m-top_medium slds-m-right_medium">
            <lightning-button variant="neutral" label="View Scheduled Jobs" onclick={getRelationshipSurveyJobs}>
            </lightning-button>
            <template if:true={showAbortBtn}>
                <div class="slds-clearfix slds-float_right" style="margin-left: auto; margin-right: 0;">
                    <lightning-button variant="neutral" disabled={disableAbortBtn} label="Abort"
                        onclick={openConfirmationModal}>
                    </lightning-button>
                </div>
            </template>
        </div>

        <div>
            <template if:true={showTable}>
                <template if:false={isLoading}>
                    <template if:true={noRecordsFound}>
                        <h1 class="slds-align_absolute-center slds-m-around_x-large">No Scheduled Jobs were found...</h1>
                    </template>
                    <template if:true={error}>
                        <h1 class="slds-align_absolute-center slds-m-around_x-large">{error.body.message}</h1>
                    </template>
                    <template if:true={scheduledJobs.length}>
                        <lightning-card>
                            <div style="max-height: 400px;"
                                class="slds-m-left_small slds-m-right_small slds-m-bottom_small">
                                <lightning-datatable key-field="Id" min-column-width='200' data={scheduledJobs}
                                    onrowselection={handleRowSelection} columns={jobColumns}>
                                </lightning-datatable>
                            </div>
                        </lightning-card>
                    </template>
                </template>

                <template if:true={isLoading}>
                    <div class="demo-only" style="height:6rem;position:relative">
                        <div class="slds-spinner_container">
                            <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    <!-- </div> -->
    </lightning-card>
    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Abort Scheduled {abortSubStr}</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    Are you sure you want to abort the selected Scheduled {abortSubStr}?
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={abortSelectedJobs} title="OK">Yes, Abort</button>
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" id="backdrop"></div>
    </template>
</template>
