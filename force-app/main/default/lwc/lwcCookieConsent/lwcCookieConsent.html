<template>
    <template if:true={isModalOpen}>
        <div class={backdrop}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" data-ui-auto="close-modal-button" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading--medium">Cookie Consent</h2>
                </header>


                <section class="slds-theme--default slds-p-horizontal--large slds-p-vertical_large">
                    <h3 class="slds-section-title slds-theme--shade slds-text-align_center">
                        <span class="slds-p-horizontal--small slds-text-align_center">By clicking "I agree" you are agreeing to the <a href={terms} >RingCentral Channel Partner Terms</a>.</span>
                    </h3>
                </section>

                <footer class="slds-modal__footer slds-grid slds-grid_align-end">
                    <button class="slds-button slds-button_neutral" data-ui-auto="cancel-button" type="button" title="Cancel" onclick={learnMoreLink}>
                        Learn More
                    </button>
                    <button class="slds-button slds-button_brand" data-ui-auto="submit-button" type="button" title="Submit" onclick={acceptCookie} disabled={isError}>
                        I Agree
                    </button>
                </footer>
            </div>
        </section>
        </div>
    </template>
</template>
