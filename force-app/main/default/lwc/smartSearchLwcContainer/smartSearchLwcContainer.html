<template>
    <form data-id="myForm" id="myForm">
        <lightning-button data-id="submitButton" type="submit" class="slds-hidden"> </lightning-button>
        <c-smart-search-header></c-smart-search-header>
        <div class="backColor slds-m-around_small slds-box">
            <c-smart-search-buttons onsearch={handleSearch} oncancel={handleCancel} oncreatenewlead={handleCreateNewLead}></c-smart-search-buttons>
            <c-smart-search-messages-panel></c-smart-search-messages-panel>
        </div>
        <c-smart-search-results></c-smart-search-results>
        <c-smart-search-custom-info></c-smart-search-custom-info>
        <div if:true={showSpinner} class="slds-is-relative">
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <lightning-spinner size="large" alternative-text="Loading...">
                </lightning-spinner>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
        <c-smart-search-ecommerce-info></c-smart-search-ecommerce-info>
        <c-smart-search-customer-profile></c-smart-search-customer-profile>
        <c-smart-search-lead-qualification></c-smart-search-lead-qualification>
        <div class="backColor slds-m-around_small slds-box">
            <c-smart-search-buttons onsearch={handleSearch} oncancel={handleCancel} oncreatenewlead={handleCreateNewLead}></c-smart-search-buttons>
        </div>
    </form>
    <c-smart-search-list-panel url-parameters={paramsFromVFPage} onmergetolead={handleMergeToLead} ontakeownership={handleTakeOwnership} onmerge={handleMergeToContact}></c-smart-search-list-panel>
</template>
