<template> 
  <div class="slds-box slds-m-around_small background">
    <lightning-button variant="base" label="Ecommerce Information" title="Ecommerce Information" icon-name={icon} onclick={showEcommerceSection} class="slds-text-heading_small title"></lightning-button>
    <template if:true={showSection}>
      <div class="slds-grid slds-gutters slds-form-element_horizontal">
        <div class="slds-col slds-size_4-of-12 slds-m-left_x-small">
          <div class="slds-m-top_small slds-form-element_horizontal slds-form-element">
            <label class="slds-form-element__label slds-no-flex" >RC Account</label>
            <div if:true={accFound} class="slds-form-element__control slds-grow">
              <a style="font-weight: bold;" href={accUrl}>{textBoxValues.rcAccountName}</a>
            </div>
            <div if:false={accFound} class="slds-form-element__control slds-grow">
              <span class="blackText">{textBoxValues.rcAccountName}</span>
            </div>
          </div>
          <lightning-input
            class="slds-m-top_small"
            name="rcAccountUserId"
            variant="label-inline"
            type="email"
            disabled="true"
            value={textBoxValues.rcAccountUserId}
            label="RC User Id"
            onchange={handleInputChange}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="rcAccountStatus"
            variant="label-inline"
            disabled="true"
            type="text"
            label="RC Account Status"
            value={textBoxValues.rcAccountStatus}
            onchange={handleInputChange}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="UserType"
            disabled="true"
            variant="label-inline"
            type="text"
            label="User Type"
            value={textBoxValues.userType}
            onchange={handleInputChange}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="Tier"
            disabled="true"
            variant="label-inline"
            type="text"
            label="Tier"
            value={textBoxValues.tier}
            onchange={handleInputChange}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="Plan"
            disabled="true"
            variant="label-inline"
            type="text"
            label="Plan"
            value={textBoxValues.plan}
            onchange={handleInputChange}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="SignupType"
            disabled="true"
            variant="label-inline"
            type="text"
            label="Signup Type"
            value={textBoxValues.signupType}
            onchange={handleInputChange}
          ></lightning-input>
        </div>
  
        <div class="slds-col slds-size_3-of-12"></div>
        <div class="slds-col slds-size_4-of-12">
          <lightning-input
            class="slds-m-top_small"
            name="Trial"
            disabled="true"
            variant="label-inline"
            type="text"
            label="Trial"
            value={textBoxValues.trial}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="NumberOfLines"
            disabled="true"
            variant="label-inline"
            type="email"
            label="Number of Lines"
            value={textBoxValues.numberOfLines}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="TotalSalesPrice"
            disabled="false"
            variant="label-inline"
            type="number"
            formatter="decimal"
            label="Total Sales Price"
            value={textBoxValues.totSalesPrice}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="RecurringSalesPrice"
            disabled="true"
            variant="label-inline"
            type="number"
            formatter="decimal"
            label="Recurring Sales Price"
            value={textBoxValues.recSalesPrice}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="Product"
            disabled="true"
            variant="label-inline"
            type="text"
            label="Product"
            value={textBoxValues.product}
          ></lightning-input>
          <lightning-input
            class="slds-m-top_small"
            name="LTV"
            disabled="true"
            variant="label-inline"
            type="number"
            formatter="decimal"
            label="LTV"
            value={textBoxValues.ltv}
          ></lightning-input>
        </div>
      </div>
    </template>
  </div>
</template>
