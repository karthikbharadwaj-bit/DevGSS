<template>
    <div class="slds-form-element">
        <label class="slds-form-element__label" for="select" if:true={label}>{label}</label>
        <div class="slds-form-element__control">
            <div class="slds-select_container">
                <div class="slds-select loading" if:true={isLoading}>Loading...</div>
                <select class="slds-select" id="select" onchange={onchange} disabled={disabled} if:false={isLoading}>
                    <template for:each={selectOptions} for:item="o" if:false={isLoading}>
                        <option value={o.value} selected={o.selected} key={o.key}>{o.label}</option>
                    </template>
                </select>
            </div>
        </div>
    </div>
</template>
