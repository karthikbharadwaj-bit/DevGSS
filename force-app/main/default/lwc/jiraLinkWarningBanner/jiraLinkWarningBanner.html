<template>
    <template if:true={showBanner}>
        <div
            class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning slds-grid slds-grid_align-start slds-m-around_small"
            role="alert"
        >
            <span
                class="slds-icon_container slds-icon-utility-warning slds-m-right_small slds-no-flex"
                title="Warning"
            >
                <lightning-icon
                    icon-name="utility:warning"
                    alternative-text="Warning"
                    size="large"
                ></lightning-icon>
                <span class="slds-assistive-text">Warning</span>
            </span>
            <div class="slds-col slds-align-spread">
                <p>{bannerBody}</p>
            </div>
        </div>
    </template>
</template>
