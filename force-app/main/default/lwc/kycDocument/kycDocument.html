<!--Na Document-->
<template>
    <div class="slds-grid slds-gutters slds-wrap">
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="Document No."
                                 placeholder="Document No."
                                 value={documentNo}
                                 data-id="document-no"
                                 class="document-no"
                                 disabled={isFieldDisable}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="date"
                                 label="Date of Issue"
                                 placeholder="Date"
                                 value={dateOfIssue}
                                 data-id="date-of-issue"
                                 class="date-of-issue"
                                 disabled={isFieldDisable}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>

        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="Place of Issue"
                                 placeholder="Place of Issue"
                                 value={placeOfIssue}
                                 data-id="place-of-issue"
                                 class="place-of-issue"
                                 disabled={isFieldDisable}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="Issuing Authority"
                                 placeholder="Issuing Authority"
                                 value={issuingAuthority}
                                 data-id="issuing-authority"
                                 class="issuing-authority"
                                 disabled={isFieldDisable}
                                 onchange={onChange}>
                </lightning-input>
            </span>
        </div>
    </div>
</template>
