<template>
    <template if:true={isOwnerUpdatedRecently}>
        <template if:true={isDisplayed}>
            <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                <span class="slds-assistive-text">warning</span>
                <span class="slds-icon_container slds-icon-utility-warning slds-m-right_x-small" title="Warning">
                    <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#warning"></use>
                    </svg>
                </span>
                <h2>NOTE: Renewal Managers are always retained on the Account Team when changing owners.</h2>
                <button class="slds-button slds-button_icon slds-button_icon-small" title="Close" onclick={closeBanner}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#close"></use>
                    </svg>
                    <span class="slds-assistive-text">Close</span>
                </button>
            </div>
        </template>
    </template>
</template>
