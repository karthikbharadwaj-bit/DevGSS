<template>
    <article class="slds-card slds-card_narrow">
        <header class="slds-card__header slds-grid">
            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:search" alternative-text="Coveo" ></lightning-icon>
                </div>
                <div class="slds-media__body slds-truncate">
                    <h2><span class="slds-text-heading_small">Coveo</span></h2></div>
            </div>
        </header>
        <div class="slds-card__body">
            <div class="slds-p-horizontal_small">
                <ul class="slds-has-dividers_around-space slot-list">
                    <template for:each={items} for:item="item">
                        <li
                            class={item.cName}
                            key={item.id}
                            data-id={item.id}
                            onmouseleave={highlightEnd}
                            onmouseover={highlightStart}
                            title={item.name}
                            ondblclick={searchIt}>
                            <a href={item.link} target="_blank">{item.name}</a>
                        </li>
                    </template>
                </ul>
            </div>
        </div>
    </article>
</template>
