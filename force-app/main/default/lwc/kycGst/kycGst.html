<!--Na Gst-->
<template>
    <div class="slds-grid slds-gutters slds-wrap">
        <div class="slds-col slds-size_5-of-12">
            <label class="slds-form-element__label">GST No</label>
            <lightning-helptext content="Gst No. field is available to edit if full Billing Address is populated and Certificate is uploaded"></lightning-helptext>
            <lightning-input type="text"
                             variant="label-hidden"
                             placeholder="GST No."
                             class="gstNo"
                             value={gstNo}
                             data-id="gst-no"
                             onchange={onChange}
                             disabled={isGstNoDisable}>
            </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-12">
                <template if:true={isGstNotCorrect}>
                    <lightning-icon icon-name="utility:error" alternative-text="Error!" variant="error"
                    title="error variant small" size="small"></lightning-icon>
                </template>
                <template if:true={isGstIsCorrect}>
                    <lightning-icon icon-name="utility:success" alternative-text="Success!" variant="success"
                    title="success variant small" size="small"></lightning-icon>
                </template>
        </div>
        
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="text"
                                 label="GST State Code of Customer"
                                 placeholder="State Code"
                                 value={stateCode}
                                 data-id="state-code"
                                 disabled="true">
                </lightning-input>
            </span>
        </div>
    </div>
</template>
