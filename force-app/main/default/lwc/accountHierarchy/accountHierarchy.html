<template>
    <lightning-card>
        <div class="slds-m-around_medium">						
            <div class="slds-grid slds-wrap">
								<div class="slds-col slds-size_2-of-12">
										<font size='3'><b>Account Status:</b></font>
								</div>
								
                <div class="slds-col slds-size_2-of-12">
                    <div class="inputPadding">
                        <label class="slds-form-element__label"
                               style="font-size: 14px;font-weight: 500;">Exclude Canceled Account(s)</label>

                    </div>
                </div>
                <div class="slds-col slds-size_1-of-12">
                    <div class="inputPadding">
                        <div class="inputPadding checkboxInput">
                            <lightning-input data-id = "filterData" name="filterData" type="checkbox" variant="label-hidden" onchange={handleFilterDataChange} checked></lightning-input>
                        </div>
                    </div>
                </div>
								
                <div class="slds-col slds-size_2-of-12">
                    <div class="inputPadding">
                        <label class="slds-form-element__label"
                               style="font-size: 14px;font-weight: 500;">Exclude Free Account(s)</label>

                    </div>
                </div>
                <div class="slds-col slds-size_1-of-12">
                    <div class="inputPadding" >
                        <div class="inputPadding checkboxInput">
                            <lightning-input data-id = "filterData2" name="filterData2" type="checkbox" variant="label-hidden" onchange={handleFilterDataChange2} checked></lightning-input>
                        </div>
                    </div>
                </div>
								
								<div class="slds-col slds-size_2-of-12">
                    <div class="inputPadding">
                        <label class="slds-form-element__label"
                               style="font-size: 14px;font-weight: 500;">Exclude Blank Account(s)</label>

                    </div>
                </div>
                <div class="slds-col slds-size_1-of-12">
                    <div class="inputPadding">
                        <div class="inputPadding checkboxInput">
                            <lightning-input data-id = "filterData3" name="filterData3" type="checkbox" variant="label-hidden" onchange={handleFilterDataChange3} checked></lightning-input>
                        </div>
                    </div>
                </div>
            </div>
						
        </div>
				        
        <div data-id="RCTableData"></div>

    </lightning-card>
</template>
