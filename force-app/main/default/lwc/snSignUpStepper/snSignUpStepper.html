<template>
    <div class={sectionClasses}>
        <div class="slds-modal slds-fade-in-open modal-wrapper">
            <div class="slds-modal slds-fade-in-open">
                <div class="main slds-p-horizontal_medium">
                    <div class="slds-progress slds-progress_vertical">
                        <ol class="slds-progress__list">
                            <li for:each={steps} for:item="step" key={step.label}>
                                <c-sn-progress-section 
                                    header={step.label} 
                                    status={step.status}
                                    last={step.lastStep}>
                                </c-sn-progress-section>
                            </li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
