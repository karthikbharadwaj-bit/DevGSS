<template>
    <template if:false={isVisible}>
        <div class="slds-grid slds-grid_align-spread slds-p-around_small toggle-header">
            <div class="toggle-label" onclick={toggleContent}>
                Show
                <lightning-icon icon-name="utility:chevrondown" size="x-small" class="chevron-icon">
                </lightning-icon>
            </div>
            <div class="powered-by">
                Powered by <strong>AI</strong> ✨
            </div>
        </div>
    </template>

    <template if:true={isVisible}>
        <div>
            <template lwc:if={isLoading}>
                <p class="slds-text-color_weak slds-p-horizontal_small">Loading...</p>
            </template>

            <template lwc:elseif={isError}>
                <p class="slds-text-color_error slds-p-horizontal_small">{rawResponse}</p>
            </template>

            <template lwc:else>
                <template if:true={formattedResponse}>
                    <ul class="custom-list slds-p-horizontal_small">
                        <template for:each={formattedResponse} for:item="caseItem" for:index="index">
                            <li key={caseItem.case_number} class="case-item">
                                <lightning-icon icon-name="standard:case" size="small"
                                    class="case-icon"></lightning-icon>
                                <div class="case-details">
                                    <div>
                                        <strong> Case: </strong>
                                        <template lwc:if={caseItem.caseUrl}>
                                            <a href={caseItem.caseUrl} target="_blank">{caseItem.case_number}</a>
                                        </template>
                                        <template lwc:else>
                                            {caseItem.case_number}
                                        </template>
                                    </div>
                                    <div class="case-subject">{caseItem.subject}</div>
                                </div>

                                <!-- right: actions (icons with feedback directly below) -->



                                <div class="actions-right">
                                    <div class="inline-actions">
                                        <!-- LIKE (stateful, no inline logic) -->
                                        <lightning-button-icon-stateful icon-name="utility:like"
                                            selected-icon-name="utility:like" alternative-text="Like" data-idx={index}
                                            onclick={onLike} selected={caseItem.isLiked} variant={caseItem.likeVariant}
                                            disabled={caseItem.actionBusy}>
                                        </lightning-button-icon-stateful>

                                        <!-- DISLIKE (stateful, no inline logic) -->
                                        <lightning-button-icon-stateful icon-name="utility:dislike"
                                            selected-icon-name="utility:dislike" alternative-text="Dislike"
                                            data-idx={index} onclick={onDislike} selected={caseItem.isDisliked}
                                            variant={caseItem.dislikeVariant} disabled={caseItem.actionBusy}>
                                        </lightning-button-icon-stateful>
                                    </div>

                                    <!-- Thanks badge appears AFTER feedback; icons remain above -->
                                    <template if:true={caseItem.reviewed}>
                                        <span class="thanks-badge">Thanks for the review</span>
                                    </template>

                                    <!-- Give Feedback link is hidden when the box is open OR after reviewed -->
                                    <div class="feedback-right">
                                        <template if:false={caseItem.showFeedback}>
                                            <template if:false={caseItem.reviewed}>
                                                <a href="javascript:void(0);" data-idx={index}
                                                    onclick={toggleFeedback}>Give Feedback</a>
                                            </template>
                                        </template>
                                    </div>
                                </div>

                                <!-- NEW: feedback box as a second row spanning details + actions -->
                                <template if:true={caseItem.showFeedback}>
                                    <div class="feedback-row">
                                        <textarea class={caseItem.feedbackClass} rows="2"
                                            placeholder="Share a quick note…" data-idx={index}
                                            oninput={onFeedbackChange}
                                            onkeydown={onFeedbackKeydown}>{caseItem.feedback}</textarea>

                                        <div class="feedback-actions">
                                            <lightning-button class="btn-compact" variant="brand" label="Send"
                                                data-idx={index} onclick={onSendFeedback}
                                                disabled={caseItem.sendDisabled}>
                                            </lightning-button>

                                            <lightning-button class="btn-compact" variant="neutral" label="Cancel"
                                                title="Cancel" data-idx={index} onclick={onCancelFeedback}>
                                            </lightning-button>
                                        </div>

                                    </div>
                                </template>



                            </li>
                        </template>
                    </ul>
                </template>

                <template lwc:if={rawResponse}>
                    <p class="slds-p-horizontal_small">{rawResponse}</p>
                </template>
            </template>
        </div>

        <div class="slds-grid slds-grid_align-spread slds-p-around_small toggle-header bottom-toggle">
            <div class="toggle-label" onclick={toggleContent}>
                Hide
                <lightning-icon icon-name="utility:chevronup" size="x-small" class="chevron-icon">
                </lightning-icon>
            </div>
            <div class="slds-text-color_weak" style="font-size: 0.8rem;">
                Powered by <strong>AI</strong> ✨
            </div>
        </div>
    </template>
</template>
