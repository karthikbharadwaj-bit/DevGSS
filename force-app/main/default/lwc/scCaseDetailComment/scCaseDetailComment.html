<template>
    <div class={wrapperCls}>
        <div class="sc-case-comment__author">
            <div class="sc-case-comment__avatar">
                <img src={pic} alt="" />
            </div>
            <div class="sc-case-comment__name">
                {author}
            </div>
        </div>
        <div class={bodyCls} data-owner={labels.author}>
            <div class="sc-case-comment__subject">{body}</div>
            <div class="sc-case-comment__date">{date}</div>
        </div>
    </div>
</template>
