<template>
    <template if:true={isEmpty}>
        <div class={classMain} onclick={doMinimize}>
            <div class="sc-trust-case__type" data-type={type}>{typeLabel}</div>
            <div class="sc-trust-case__title">
                <span
                    class="sc-trust-case__number"
                    title={labels.caseNumber}
                    onclick={clickNumber}
                    data-url={url}
                    if:true={isCase}
                    >{number}</span
                >
                <a href={url} onclick={clickLink} title={title}>{title}</a>
            </div>
            <div class="sc-trust-case__status">{status}</div>
            <div class="sc-trust-case__modify">{formatedModify}</div>
            <div class="sc-trust-case__minimize"></div>
        </div>
        <div class="sc-trust-case__details">
            <pre>{details}</pre>
        </div>
    </template>
</template>
