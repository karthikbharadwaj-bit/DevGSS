<template>
    <div class="showSpinner" if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
    </div>
    <div class={mainTheme} role="status">
        <div class="slds-media__figure">
          <lightning-icon variant={iconVariant} icon-name={iconName} alternative-text={iconAlternativeText} size="small"></lightning-icon>
        </div>
        <div class="slds-media__body">
          <p>
            This Contact Center is being migrated to NGBS. If an urgent change order is needed, please fill out the <a target="_blank" href={formLink}>Unblock Account Request</a>
          </p>
        </div>
    </div>
</template>
