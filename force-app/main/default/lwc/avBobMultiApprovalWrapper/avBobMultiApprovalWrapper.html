<template>
    <c-lwc-spinner></c-lwc-spinner>
    <c-lwc-toasts></c-lwc-toasts>

    <div class="slds-tabs_default">
        <ul class="slds-tabs_default__nav sticky-top" role="tablist">
            <template for:each={tabs} for:item="tab">
                <li key={tab.guid} class={tab.tabClass}
                    title={tab.title}
                    role="presentation"
                    data-id={tab.guid}
                    onclick={toggle}>

                    <a class="slds-tabs_default__link"
                       href="#"
                       role="tab"
                       id={tab.guid}>
                        <span if:true={tab.isMasterApproval} class="slds-tabs__left-icon">
                            <lightning-icon icon-name="utility:favorite"
                                            aria-hidden="true"
                                            alternative-text="icon"
                                            size="x-small">
                            </lightning-icon>
                        </span>
                        {tab.name}
                    </a>
                </li>
            </template>
        </ul>

        <template for:each={layoutItems} for:item="layoutItem">
            <div key={layoutItem.guid}
                 class={layoutItem.contentClass}
                 role="tabpanel">
                <c-av-create-layout sections={layoutItem.sections}
                                             detailguid={layoutItem.guid}
                                             recordtypename={layoutItem.recordTypeName}
                                             header-label={layoutItem.headerLabel}
                                             onlayoutrendered={showButtons}>
                </c-av-create-layout>
            </div>
        </template>
    </div>

    <div if:true={isShowButtons} class="slds-button-group-row footer-buttons sticky-bottom border-buttons">
        <div if:true={hasErrors} class="slds-button-group-item popover-relative">
            <button class="footer-button page-error-button slds-button slds-button_icon-error slds-m-right_small">
                <lightning-icon class="slds-icon-utility-error slds-icon_container red-icon"
                                title="Error"
                                icon-name="utility:error"
                                size="small"
                                onclick={onErrorButtonClick}>
                </lightning-icon>
            </button>
            <div class="slds-popover slds-popover_error slds-nubbin_bottom-left slds-rise-from-ground popover-position"
                 role="dialog"
                 tabindex="-1"
                 id="error_popover">
                <button class="slds-button slds-button_icon slds-button_icon-small slds-float_right slds-popover__close slds-button_icon-inverse"
                        title="Close dialog"
                        onclick={closeErrorPopover}>
                    <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#close"></use>
                    </svg>
                    <span class="slds-assistive-text">Close dialog</span>
                </button>
                <header class="slds-popover__header">
                    <div class="slds-media slds-media_center slds-has-flexi-truncate ">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:error" size="small" class="white-icon" ></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-truncate slds-text-heading_medium"
                                id="dialog-heading-id-1"
                                title="We hit a snag.">
                                We hit a snag.
                            </h2>
                        </div>
                    </div>
                </header>
                <div class="slds-popover__body slds-popover__body_small">
                    <div if:true={hasErrorMessages}>
                        <p> <b>Review the errors on the tabs</b> </p>
                        <ul class="slds-list_dotted">
                            <template for:each={errorMessages} for:item="errorMessage">
                                <li key={errorMessage.guid}>{errorMessage.message}</li>
                            </template>
                        </ul>
                    </div>
                    <div if:true={hasFieldsErrors}>
                        <p> <b>Review the following fields on the tabs</b> </p>
                        <ul class=slds-has-dividers_top-space>
                            <template for:each={hrefTabs} for:item="tab">
                                <li key={tab.guid} class="slds-item">
                                    <a data-id={tab.guid} href={tab.hrefId} onclick={toggle}>{tab.name}</a>
                                    <ul class="slds-list_dotted">
                                        <template for:each={tab.fields} for:item="field">
                                            <li data-id={field.id} key={field.id} class="field-with-error" onclick={onFieldClick}>{field.label}</li>
                                        </template>
                                    </ul>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="slds-button-group-item">
            <button type="button" class="slds-button slds-m-left_medium slds-button_neutral" onclick={onCancel}>Cancel</button>
        </div>

        <div class="slds-button-group-item">
            <button type="button" class="slds-button slds-m-right_medium slds-button_brand" onclick={onSave}>{saveLabel}</button>
        </div>
    </div>

</template>
