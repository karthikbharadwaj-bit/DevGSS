<template>
    <div class="sc-topic__header">{title}</div>
    <div class="sc-topic__body">
        <ul>
            <template for:each={outList} for:item="item" for:index="inx">
                <li key={item.id}>
                    <a href={item.link} target={target}>
                        <span>{item.name}</span>
                    </a>
                </li>
            </template>
        </ul>
    </div>
    <div class="sc-topic__footer"><a href={viewAll} target={target}>{label.SC_viewAllTopics}</a></div>
</template>
