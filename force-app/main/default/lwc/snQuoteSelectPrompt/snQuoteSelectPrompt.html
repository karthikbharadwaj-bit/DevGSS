<template>
    <div class="title-head"
         data-ui-auto="show-hide-quote-select-prompt"
         onclick={handleClick}>
        <div class="title-block">
            <div class="title-hide-pointer title-block">
                <lightning-icon icon-name={chevron}
                                size="xx-small"
                                class="icon-xx-small">
                </lightning-icon>
            </div>
            <div class={titleStyle} data-ui-auto="quote-select-prompt-name" title={choosePrimaryQuote}>
                {choosePrimaryQuote}
            </div>
        </div>
    </div>
    <div class={sectionClasses}>
        <section for:each={options} for:item="item" key={item.label}>
            <div class="slds-text-heading_small">
                <span class="slds-radio slds-p-bottom_small slds-p-left_xxx-small">
                    <input
                        id={item.label}
                        type="radio"
                        value={item.label}
                        name="default"
                        checked={item.isChecked}
                        onclick={handleChange}
                    />
                    <label class="slds-radio__label" for={item.label}>
                        <span class="slds-radio_faux"></span>
                        <span>{item.label}</span>
                    </label>
                </span>
            </div>
        </section>
    </div>
</template>
