<template>
    <div class="slds-m-around_medium">

        <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-1">
                <label class="slds-form-element__label" style="font-size: 14px;font-weight: 700;">Upload
                    File</label>
                <lightning-input type="file" accept=".xls, .xlsx" onchange={handleFilesChange}></lightning-input>
            </div>
        </div>

        <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-1">
                <lightning-button class="dftButton" variant="base" type="submit" label="Submit"
                    onclick={processMarketoQueue}></lightning-button>
            </div>
        </div>

        <BR><BR>
        <h1 class="slds-text-heading--medium slds-section-title--divider">Number of Records: {numberOfRows} </h1>
        <h1 class="slds-text-heading--medium slds-section-title--divider">Processed: {progress} </h1>

        <lightning-progress-bar value={progress}></lightning-progress-bar>


    </div>
</template>
