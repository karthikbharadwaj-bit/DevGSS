<template>
    <div class={proServSectionClasses}>
        <div class="slds-progress slds-progress_vertical">
            <c-sn-progress-section 
                header="Check for Main Cost Center" 
                status={firstStepStatus}>
            </c-sn-progress-section>
        </div>
        <div class="slds-progress slds-progress_vertical">
            <c-sn-progress-section 
                header="Creation of a Main Cost Center"
                status={secondStepStatus}>
            </c-sn-progress-section>
        </div>
        <div class="slds-progress slds-progress_vertical last">
            <c-sn-progress-section 
                header="Sign Up ProServ" 
                status={lastStepStatus} 
                last>
                <lightning-tabset lwc:if={helpSignUpLabel}>
                    <lightning-tab onactive={handleSelectedSignUpTab}>
                        <div class="slds-m-vertical_xx-small text">{helpSignUpLabel}</div>
                    </lightning-tab>
                </lightning-tabset>
            </c-sn-progress-section>
        </div>

    </div>
</template>
