<template>
    <div class="slds-docked-form-footer">
        <button type="button"
                class="slds-button slds-button_neutral"
                onclick={cancel}>Cancel</button>
        <button type="submit"
                class="slds-button slds-button_brand"
                disabled={isConvertDisabled}>Convert
                <div if:true={isShowTooltip} class="slds-popover slds-popover_tooltip slds-nubbin_bottom slds-popover_large" role="tooltip">
                    <div class="slds-popover__body">{tooltipMessage}</div>
                </div>
        </button>
    </div>
</template>
