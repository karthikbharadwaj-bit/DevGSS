<template>
    <lightning-card  variant="Narrow"  title="Quick Links" icon-name="standard:link" class="slds-m-horizontal_small">
        <div class="slds-p-horizontal_small">
            <ul class="slds-grid slds-grid_pull-padded slds-wrap">
                <template for:each={navigation} for:item="item">
                    <c-sc-admin-link-item
                        key={item.Title}
                        title={item.Title}
                        icon={item.Icon}
                        link={item.Link}
                        description={item.Description}
                        class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-2 navigation__item">
                    </c-sc-admin-link-item>
                </template>
            </ul>
        </div>
    </lightning-card>
</template>
