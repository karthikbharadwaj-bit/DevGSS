<template>
    <template if:true={accountHasAppliedChanges}>
        <li class={containerClasses}>
            <article class="slds-setup-assistant__step ">
                <div class="slds-media">
                    <div class="slds-setup-assistant__step-summary-content slds-media__body">
                        <h3 class="slds-setup-assistant__step-summary-title slds-text-heading_small">
                            {label.Opportunitysection}
                        </h3>
                    </div>
                    <div class="opportunity-info-notifications">
                        <c-lwc-notifications-bar notifications={notifications}></c-lwc-notifications-bar>
                    </div>
                    <div if:false={isTerminated}>
                        <div class="slds-media__figure slds-media__figure_reverse slds-grid" if:false={isExpanded}>
                            <lightning-button onclick={toggleIsExpanded} label="Edit"></lightning-button>
                        </div>
                    </div>
                </div>
                <c-placeholder-loading type='line'
                                        width="20rem"
                                        if:true={isLoading}></c-placeholder-loading>
                <div class="slds-container slds-grid slds-grid_vertical slds-is-relative slds-p-bottom_small" if:false={isLoading}>
                    <template if:true={isLeadRecordTypeSales}>
                            <lightning-radio-group name="radioGroup"
                            if:true={showRadioGroup}
                            options={options}
                            value={value}
                            type="radio"
                            disabled={notIsExpanded}
                            onchange={handleOppCreation}></lightning-radio-group>
                    </template>
                </div>
                <div class="slds-setup-assistant__step-summary" if:true={createNewOpp}>
                    <!-- Collapsed Preview -->
                    <div class="slds-page-header__row" if:true={isCollapsedView}>
                        <!-- Opportunity Name -->
                        <div class="slds-m-right_large container-width-max">
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                {label.OpportunityName}
                            </p>
                            <h3 class="slds-text-heading_small slds-truncate">
                                <span if:true={opportunityName}>{opportunityName}</span>
                                <span if:false={opportunityName}>{label.None}</span>
                            </h3>
                        </div>
                        <!-- Selected Business Identity -->
                        <div class="slds-m-right_large" if:true={isSelectPackagesByBusinessIdentity}>
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                {label.BusinessIdentity}
                            </p>
                            <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                                <template if:true={selectedBusinessIdentity}>{selectedBusinessIdentity}</template>
                                <template if:false={selectedBusinessIdentity}>{label.None}</template>
                            </h3>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                                   type="line"
                                                   width="5.35rem">
                            </c-placeholder-loading>
                        </div>
                        <!-- Selected Currency -->
                        <div class="slds-m-right_large" if:true={isSelectPackagesByBusinessIdentity}>
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                {label.Currency}
                            </p>
                            <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                                <template if:true={selectedCurrency}>{selectedCurrency}</template>
                                <template if:false={selectedCurrency}>{label.None}</template>
                            </h3>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                                   type="line"
                                                   width="5.35rem">
                            </c-placeholder-loading>
                        </div>
                        <!-- Selected Country -->
                        <div if:true={isCountryPicklistShown} class="slds-m-right_large">
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                {label.Country}
                            </p>
                            <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                                <template if:true={country}>{country}</template>                                
                            </h3>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                                    type="line"
                                                    width="5.35rem">
                            </c-placeholder-loading>
                        </div>                        
                        <!-- Selected Brand -->
                        <div class="slds-m-right_large">
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                {label.Brand}
                            </p>
                            <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                                <template if:true={selectedBrand}>{selectedBrand}</template>
                                <template if:false={selectedBrand}>{label.None}</template>
                            </h3>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                                    type="line"
                                                    width="5.35rem">
                            </c-placeholder-loading>
                        </div>
                        <!-- Selected CloseDate -->
                        <div class="slds-m-right_large">
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                Close Date
                            </p>
                            <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                                <template if:true={selectedCloseDate}>{formattedCloseDate}</template>
                                <template if:false={selectedCloseDate}>{label.None}</template>
                            </h3>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                type="line"
                                width="5.35rem">
                            </c-placeholder-loading>
                        </div>
                        <!-- Selected Service Plan -->
                        <div class="slds-m-right_large" if:true={showSelectedServicePlan}>
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                {label.SelectedServicePlan}
                            </p>
                            <template if:false={isPreselectLoading}>
                                <h3 class="slds-text-heading_small">
                                    {selectedServiceName}
                                </h3>
                                <ul class="slds-page-header__name-meta slds-list_horizontal slds-has-dividers_right"
                                    if:true={selectedServiceId}>
                                    <li class="slds-item">
                                        <template if:true={selectedServiceChargeTerm}>
                                            {selectedServiceChargeTerm}
                                        </template>
                                        <template if:false={selectedServiceChargeTerm}>
                                            {label.None}
                                        </template>
                                    </li>
                                    <li class="slds-item" if:true={selectedServicePrice}>
                                        <lightning-formatted-number value={selectedServicePrice}
                                                                    format-style="currency"
                                                                    currency-display-as="code"
                                                                    currency-code={selectedServicePriceCurrencyCode}>
                                        </lightning-formatted-number>

                                    </li>
                                    <li class="slds-item" if:true={selectedServiceId}>{label.BillingSystem}
                                        <template if:true={selectedServiceIsLegacy}> {label.Legacy}</template>
                                        <template if:false={selectedServiceIsLegacy}> {label.NGBS}</template>
                                    </li>
                                </ul>
                            </template>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                                    type="line"
                                                    width="13rem">
                            </c-placeholder-loading>
                        </div>

                          <!-- Selected default area code -->
                          <div class="slds-m-right_large" if:true={selectedAreaCodeRequired}>
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                Default Area Code
                            </p>
                            <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                                <template if:true={selectedAreaCode}>
                                    ({selectedAreaCode.areaCode})
                                    <span if:true={selectedAreaCode.city}> {selectedAreaCode.city}</span>
                                </template>
                                <template if:false={selectedAreaCode}>--None--</template>
                                <ul if:true={selectedAreaCode} class="slds-page-header__name-meta slds-list_horizontal slds-has-dividers_right">
                                    <li class="slds-item" if:true={selectedAreaCode.country}>{selectedAreaCode.country}</li>
                                    <li class="slds-item" if:true={selectedAreaCode.state}>{selectedAreaCode.state}</li>
                                </ul>
                            </h3>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                                   type="line"
                                                   width="5.35rem">
                            </c-placeholder-loading>
                        </div>
                    </div>
                </div>

                <!-- Expanded Block -->
                <div class="slds-summary-detail__content" if:true={createNewOpp}>
                    <lightning-layout class="slds-gutters slds-m-bottom_medium" if:true={isExpandedView}>
                        <!-- Opportunity Name -->
                        <lightning-layout-item size="3" padding="horizontal-small">
                            <lightning-input type="text" name="opportunityName"
                                            label="Opportunity Name"
                                            value={opportunityName}
                                            required
                                            onchange={onOpportunityNameChange}></lightning-input>
                        </lightning-layout-item>
                        <!-- Billing System -->
                        <lightning-layout-item padding="horizontal-small" if:true={isSelectPackagesByBusinessIdentity} >
                            <div class="billing-system-container">
                                <p class="slds-text-title slds-m-bottom_xx-small slds-m-top_xx-small">
                                    {label.BillingSystem}
                                </p>
                                <p>
                                    <template if:true={isLegacy}>{label.Legacy}</template>
                                    <template if:false={isLegacy}>{label.NGBS}</template>
                                </p>
                            </div>
                        </lightning-layout-item>
                        <!-- Country -->
                        <lightning-layout-item padding="horizontal-small" size="3" large-device-size="2" if:true={isCountryPicklistShown} >
                            <c-input-select label="Country" options={countries} value={country} onchange={onCountryChange}></c-input-select>
                        </lightning-layout-item>
                        <!-- Brand -->
                        <lightning-layout-item padding="horizontal-small" if:true={isSelectPackagesByBusinessIdentity} >
                            <div class="slds-m-right_large">
                                <p class="slds-text-title slds-m-bottom_xx-small slds-m-top_xx-small">Brand</p>
                                <p>{selectedBrand}</p>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>

                    <c-cl-service-plan-selector is-shown={isExpandedView}></c-cl-service-plan-selector>

                </div>

                <!-- Error Container -->
                <ul class="slds-list_dotted slds-media__body slds-text-color_error slds-m-top_small">
                    <li if:true={showIsOpportunityNameMissingError}>
                        <b>{label.Opportunitynameisrequired}</b><br>
                        {label.Pleasespecifyanopportunityname}
                    </li>
                    <li if:true={showIsServicePlanMissingError}>
                        <b>{label.ServicePlanisrequired}</b><br>
                        {label.PleaseselectServicePlan}
                    </li>
                    <li if:true={showIsConnectingWithNgbsError}>
                        <b>{label.TryingtoconnectwithNGBS}</b><br>
                        {label.Ifconnectionisnotreachedpleaserefresh}
                    </li>
                    <li if:true={showIsNgbsDefaultAreaCodeMissingError}>
                        <b>Default Area Code is required</b><br>
                        Please select Default Area Code
                    </li>
                    <li if:true={showIsNgbsChargeTermMissingError}>
                        <b>{label.ChargeTermisrequired}</b><br>
                        {label.PleaseselectChargeTerm}
                    </li>
                    <li if:true={isCloseDateMissing}>
                        <b>{label.CloseDateIsRequired}</b><br>
                        {label.SelectCloseDate}
                    </li>
                </ul>
                <div class="slds-summary-detail__content" if:true={selectExistingOpp}>
                    <!-- Matched Opportunities List-->
                        <h4 class="slds-form-element__label" if:true={accountHasOpportunities}>
                            {label.Choosefrommatchedopportunities}
                        </h4>
                    <div class="slds-container slds-grid slds-grid_vertical slds-is-relative table-container"
                        if:true={accountHasOpportunities}>
                        <div class="header-background slds-border_bottom slds-shrink-none"></div>
                            <div class="slds-scrollable_y">

                                <table class="slds-table slds-table_cell-buffer slds-table_bordered table slds-table_fixed-layout">
                                    <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="th-static slds-p-around_none" style="width:3.25rem">
                                        </th>
                                        <th class="th-static slds-p-around_none">
                                            <span class="slds-truncate th-inner"
                                                title="Opportunity Name">{label.OpportunityName}</span>
                                            <span class="slds-truncate th-inner-hidden">{label.OpportunityName}</span>
                                        </th>
                                        <th class="th-static slds-p-around_none">
                                            <span class="slds-truncate th-inner"
                                                title="Stage">{label.Stage}</span>
                                            <span class="slds-truncate th-inner-hidden">{label.Stage}</span>
                                        </th>
                                        <th class="th-static slds-p-around_none">
                                            <span class="slds-truncate th-inner"
                                                title="Opportunity Owner">{label.OpportunityOwnerAlias}</span>
                                            <span class="slds-truncate th-inner-hidden">{label.OpportunityOwnerAlias}</span>
                                        </th>
                                        <th class="th-static slds-p-around_none">
                                            <span class="slds-truncate th-inner"
                                                title="Estimated 12 Month Booking">{label.Estimated12MonthBooking}</span>
                                            <span class="slds-truncate th-inner-hidden">{label.Estimated12MonthBooking}</span>
                                        </th>
                                        <th class="th-static slds-p-around_none">
                                            <span class="slds-truncate th-inner"
                                                title="Last Modified Date">{label.LastModifiedDate}</span>
                                            <span class="slds-truncate th-inner-hidden">{label.LastModifiedDate}</span>
                                        </th>
                                        <th class="th-static slds-p-around_none">
                                            <span class="slds-truncate th-inner"
                                                    title="Opportunity Record Type">{label.OpportunityRecordType}</span>
                                            <span class="slds-truncate th-inner-hidden">{label.OpportunityRecordType}</span>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <template for:each={matchedOpportunities} for:item="Opportunity">
                                        <tr key={Opportunity.id} class={Opportunity.cssClass}>

                                            <td class="slds-text-align_right">
                                                <lightning-input type="radio" name="matchedOpportunity"
                                                                class="column-group-header matched-Opportunity-checkbox"
                                                                variant="label-hidden"
                                                                label={Opportunity.name}
                                                                value={Opportunity.id}
                                                                checked={Opportunity.isSelected}
                                                                disabled={notIsExpanded}
                                                                onchange={onMatchedOpportunitySelected}></lightning-input>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={Opportunity.name}>
                                                    <a href={Opportunity.url} tabindex="-1"
                                                    target="_blank">{Opportunity.name}</a>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={Opportunity.stage}>{Opportunity.stage}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={Opportunity.ownername}>
                                                    {Opportunity.ownername}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={Opportunity.estimated12monthbooking}>
                                                    {Opportunity.estimated12monthbooking}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={Opportunity.lastmodifieddate}>
                                                    {Opportunity.lastmodifieddate}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={Opportunity.recordtype}>
                                                    {Opportunity.recordtype}
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                                <tfoot if:true={hasMoreOpportunities}>
                                <tr>
                                    <td class="slds-text-align_center slds-border_top" colspan="6">
                                        <button class="slds-button slds-button_bare"
                                                type="button"
                                                disabled={hasMoreOpportunitiesDisabled}
                                                onclick={loadMoreOpportunities}>{label.Loadmore}
                                        </button>
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Toggle Expand -->
                <li class="slds-media__body slds-m-top_small">
                    <label if:true={doNotCreateOpp}>
                        {label.NoOpportunitywillbecreated}
                    </label>
                    <div if:false={accountHasOpportunities}>
                        <label if:true={selectExistingOpp}>
                            <b>{label.NoOpportunitiesmatchthechosenAccountAnewOpportunitywillbecreated}</b>
                        </label>

                    <div class="slds-p-top_large" if:true={selectExistingOpp}>
                        <!-- Collapsed Preview -->
                <div class="slds-page-header__row" if:true={isCollapsedView}>
                    <!-- Opportunity Name -->
                    <div class="slds-m-right_large container-width-max">
                        <p class="slds-text-title slds-m-bottom--xx-small">
                            {label.OpportunityName}
                        </p>
                        <h3 class="slds-text-heading_small slds-truncate">
                            <span if:true={opportunityName}>{opportunityName}</span>
                            <span if:false={opportunityName}>{label.None}</span>
                        </h3>
                    </div>
                    <!-- Selected Brand -->
                    <div class="slds-m-right_large">
                        <p class="slds-text-title slds-m-bottom--xx-small">
                            {label.Brand}
                        </p>
                        <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                            <template if:true={selectedBrand}>{selectedBrand}</template>
                            <template if:false={selectedBrand}>{label.None}</template>
                        </h3>
                        <c-placeholder-loading if:true={isPreselectLoading}
                                                type="line"
                                                width="5.35rem">
                        </c-placeholder-loading>
                    </div>
                        <!-- Selected CloseDate -->
                        <div class="slds-m-right_large">
                            <p class="slds-text-title slds-m-bottom--xx-small">
                                Close Date
                            </p>
                            <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                                <template if:true={selectedCloseDate}>{formattedCloseDate}</template>
                                <template if:false={selectedCloseDate}>{label.None}</template>
                            </h3>
                            <c-placeholder-loading if:true={isPreselectLoading}
                                type="line"
                                width="5.35rem">
                            </c-placeholder-loading>
                        </div>
                            <!-- Selected Service Plan -->
                    <div class="slds-m-right_large">
                        <p class="slds-text-title slds-m-bottom--xx-small">
                            {label.SelectedServicePlan}
                        </p>
                        <template if:false={isPreselectLoading}>
                            <h3 class="slds-text-heading_small">
                                {selectedServiceName}
                            </h3>
                            <ul class="slds-page-header__name-meta slds-list_horizontal slds-has-dividers_right"
                                if:true={selectedServiceId}>
                                <li class="slds-item">
                                    <template if:true={selectedServiceChargeTerm}>
                                        {selectedServiceChargeTerm}
                                    </template>
                                    <template if:false={selectedServiceChargeTerm}>
                                        {label.None}
                                    </template>
                                </li>
                                <li class="slds-item" if:true={selectedServicePrice}>
                                    <lightning-formatted-number value={selectedServicePrice}
                                                                format-style="currency"
                                                                currency-display-as="code"
                                                                currency-code={selectedServicePriceCurrencyCode}>
                                    </lightning-formatted-number>

                                </li>
                                <li class="slds-item" if:true={selectedServiceId}>{label.BillingSystem}
                                    <template if:true={selectedServiceIsLegacy}> {label.Legacy}</template>
                                    <template if:false={selectedServiceIsLegacy}> {label.NGBS}</template>
                                </li>
                            </ul>
                        </template>
                        <c-placeholder-loading if:true={isPreselectLoading}
                                                type="line"
                                                width="13rem">
                        </c-placeholder-loading>
                    </div>

                     <!-- Selected default area code -->
                     <div class="slds-m-right_large" if:true={selectedAreaCodeRequired}>
                        <p class="slds-text-title slds-m-bottom--xx-small">
                            Default Area Code
                        </p>
                        <h3 class="slds-text-heading_small" if:false={isPreselectLoading}>
                            <template if:true={selectedAreaCode}>
                                ({selectedAreaCode.areaCode})
                                <span if:true={selectedAreaCode.city}> {selectedAreaCode.city}</span>
                            </template>
                            <template if:false={selectedAreaCode}>--None--</template>
                            <ul if:true={selectedAreaCode} class="slds-page-header__name-meta slds-list_horizontal slds-has-dividers_right">
                                <li class="slds-item" if:true={selectedAreaCode.country}>{selectedAreaCode.country}</li>
                                <li class="slds-item" if:true={selectedAreaCode.state}>{selectedAreaCode.state}</li>
                            </ul>
                        </h3>
                        <c-placeholder-loading if:true={isPreselectLoading}
                                               type="line"
                                               width="5.35rem">
                        </c-placeholder-loading>
                    </div>
                </div>
            </div>
            <!-- Expanded Block -->
            <div class="slds-summary-detail__content" if:true={selectExistingOpp}>
                <lightning-layout class="slds-gutters slds-m-bottom_medium" if:true={isExpanded}>
                    <!-- Opportunity Name -->
                    <lightning-layout-item size="3" padding="horizontal-small">
                        <lightning-input type="text" name="opportunityName"
                                        label="Opportunity Name"
                                        value={opportunityName}
                                        required
                                        onchange={onOpportunityNameChange}></lightning-input>
                    </lightning-layout-item>
                </lightning-layout>

                <c-cl-service-plan-selector is-shown={isExpanded}></c-cl-service-plan-selector>

            </div>
        </div>

                </li>

                <div class="slds-clearfix slds-m-top_small" if:true={isExpanded}>
                    <div class="slds-float_right">
                        <lightning-button variant="brand" onclick={toggleIsExpanded} label="Apply"></lightning-button>
                    </div>
                </div>
            </article>
        </li>
    </template>
</template>
