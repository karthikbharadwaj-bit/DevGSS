<template>
    <div lwc:dom="manual"></div>
    <div class="slds-modal-component">
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header slds-grid slds-wrap">
                    <div class="slds-size_10-of-12 slds-align_absolute-center">
                        <h2 class="slds-text-heading--medium">New Local Subscribed Address</h2>
                    </div>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-radio-group
                        name="Select a record type"
                        label="Select a record type"
                        options={recordTypes}
                        value={selectedRecordType}
                        required
                        message-when-value-missing="Record type is required"
                        onchange={onRecordTypeSelected}
                        type="radio"
                    ></lightning-radio-group>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel"
                                      class="slds-m-left_small"
                                      onclick={onCancel}>
                    </lightning-button>
                    <lightning-button label="Submit"
                                      class="slds-m-left_small"
                                      onclick={onSubmit}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </div>
</template>
