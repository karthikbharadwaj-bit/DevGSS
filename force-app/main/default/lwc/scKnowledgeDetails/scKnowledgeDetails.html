<template>
    <article class="scKnowledgeDetails">
        <div class="scKnowledgeDetails__content scKnowledgeDetails__summary" lwc:dom="manual"></div>
        <h3 if:true={showDetailsHeader}>{detailsTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__details" if:true={showDetails} lwc:dom="manual"></div>
        <h3 if:true={showIssue}>{issueTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__issue" if:true={showIssue} lwc:dom="manual"></div>
        <h3 if:true={showQuestion}>{questionTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__question" if:true={showQuestion} lwc:dom="manual"></div>
        <h3 if:true={showSymptom}>{symptomTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__symptom" if:true={showSymptom} lwc:dom="manual"></div>
        <h3 if:true={showSTR}>{STRTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__str" if:true={showSTR} lwc:dom="manual"></div>
        <h3 if:true={showAffectedEnv}>{affectedEnvTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__affectedEnv" if:true={showAffectedEnv} lwc:dom="manual"></div>
        <h3 if:true={showCause}>{causeTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__cause" if:true={showCause} lwc:dom="manual"></div>
        <h3 if:true={showResolution}>{resolutionTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__resolution" if:true={showResolution} lwc:dom="manual"></div>
        <h3 if:true={showStatus}>{statusTitle}</h3>
        <div class="scKnowledgeDetails__content scKnowledgeDetails__status" if:true={showStatus} lwc:dom="manual"></div>
    </article>
</template>
