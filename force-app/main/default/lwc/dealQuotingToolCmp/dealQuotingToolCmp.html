<template>
	<div class="container" lwc:dom="manual"></div>
	<lightning-tabset>
		<lightning-tab label="Deal Quoting Tool">
			<lightning-card>

				<div slot="actions">
					<div class="slds-clearfix">
						<div class="slds-float_right">
							<lightning-button variant="brand" label="Apply to Quote" title="Apply to Quote" onclick={handleAcceptRecommendation} class="slds-m-left_x-small"></lightning-button>
							<lightning-button variant="brand" label="Refresh from Quote" title="Refresh from Quote" onclick={refreshFromQuoteClick} class="slds-m-left_x-small"></lightning-button>
							<lightning-button variant="brand" label="Save" title="Save" onclick={saveDealQuoteInfo} class="slds-m-left_x-small"></lightning-button>
						</div>
					</div>
				</div>
				
				<div class="slds-p-horizontal_small slds-box">
					<div class="slds-grid slds-gutters slds-m-vertical_small">
						<div class="slds-col blue_background slds-size_1-of-1 slds-p-vertical_small"> {dealCharactersticTitle} </div>
					</div>
					<div class='slds-grid slds-wrap'>
						<div class="slds-col slds-size_1-of-3 slds-p-around_small">
							<div class="slds-form-element slds-form-element_horizontal-1">
								<c-lwc-lookup lookup-label="Quote Id" object-api-name="Quote" icon-name="standard:Quote" fields="OpportunityId,Opportunity.Name" onrecordselection={onQuoteSelection} selected-value={selectedQuote} selected-record-id={dealQuoteInfo.Sales_Agreement__c}></c-lwc-lookup>
								<lightning-input type="hidden" value={dealQuoteInfo.Sales_Agreement__c} label="" data-id="quote__c" onchange={inputChangeEvent}></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<c-lwc-lookup lookup-label="Opportunity Link" object-api-name="Opportunity" icon-name="standard:Opportunity" selected-record-id={dealQuoteInfo.Opportunity__c} selected-value={selectedOpportunity} onrecordselection={onOpportuntiySelection}></c-lwc-lookup>
								<lightning-input type="hidden" value={dealQuoteInfo.Opportunity__c} label="" data-id="opportunity__c" onchange={inputChangeEvent}></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1 ">
								<lightning-combobox name="tier" label="Edition" placeholder="Select Edition" options={tierOptions} value={dealQuoteInfo.Tier__c} data-id="Tier__c" onchange={inputChangeEvent}></lightning-combobox>
							</div>
							

							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-combobox name="contractYears" label="Contract Length (Years)" placeholder="Select Contract Length" options={yearOptions} value={dealQuoteInfo.Contract_Length_Years__c} data-id="Contract_Length_Years__c" onchange={inputChangeEvent}></lightning-combobox>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-combobox name="paymentPlan" label="Payment Plan" placeholder="Select Plan" options={planOptions} value={dealQuoteInfo.Payment_Plan__c} data-id="Payment_Plan__c" onchange={inputChangeEvent}></lightning-combobox>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-combobox name="sector" label="Sector" placeholder="Select Sector" options={sectorOptions} value={dealQuoteInfo.Sector__c} data-id="Sector__c" onchange={inputChangeEvent}></lightning-combobox>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-input type="number" label="Total Number of Employees" value={dealQuoteInfo.Total_Number_of_Employees__c} data-id="Total_Number_of_Employees__c" onchange={inputChangeEvent}></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-combobox name="selectTerm" label="Client has a contact center?" placeholder="Select Option" options={termOptions} value={dealQuoteInfo.Potential_to_sell_contact_center_in_near__c} data-id="Potential_to_sell_contact_center_in_near__c" onchange={inputChangeEvent}></lightning-combobox>
							</div>
							<template if:true={FALSE_CONST}>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-combobox name="selectFeatures" label="Features" placeholder="Select Features" options={featureOptions} value={dealQuoteInfo.Features__c} data-id="Features__c" onchange={inputChangeEvent}></lightning-combobox>
							</div>
							</template>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-input type="number" label="Free Months Given" value={dealQuoteInfo.Free_Months_Given__c} data-id="Free_Months_Given__c" onchange={inputChangeEvent}></lightning-input>
							</div>
							
						</div>
						<div class="slds-col slds-size_1-of-3 slds-p-around_small">
							<div class="slds-grid slds-wrap slds-m-vertical_large">
								 
							</div>
							<div class="slds-grid slds-wrap slds-m-vertical_large">
								 
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1 slds-m-bottom_medium">
								<lightning-input type="number" label="Number of Unlimited DLs" value={dealQuoteInfo.Number_of_Unlimited_DLs__c} data-id="Number_of_Unlimited_DLs__c" onchange={inputChangeEvent} onblur={updateTotalUnlimitedDL}></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1 ">
								<lightning-input type="number" label="Number of Limited Exts" value={dealQuoteInfo.Number_of_Limited_Exts__c} data-id="Number_of_Limited_Exts__c" onchange={inputChangeEvent} onblur={updateTotalLimitedExtension}></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1" >
								<lightning-input type="number" formatter="currency" label="Undiscounted Unit Price for Limited Exts." value={dealQuoteInfo.Undiscounted_Unit_Price_for_Limited_Exts__c} data-id="Undiscounted_Unit_Price_for_Limited_Exts__c" onchange={inputChangeEvent} onblur={updateTotalLimitedExtension} step="0.01"></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1 ">
								<lightning-input type="number" label="Number of Additional local Number (incl. Toll Free)" value={dealQuoteInfo.Number_of_additional_local_number_incl__c} data-id="Number_of_additional_local_number_incl__c" onchange={inputChangeEvent}></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1 ">
								<lightning-input type="number" label="Undiscounted Unit Price for additional local numbers" value={dealQuoteInfo.Undiscounted_Unit_Price_for_additional_l__c} data-id="Undiscounted_Unit_Price_for_additional_l__c" onchange={inputChangeEvent}  step="0.01"></lightning-input>
							</div>
							
						</div>
						<div class="slds-col slds-size_1-of-3 slds-p-around_small">
							<div class="slds-grid slds-wrap slds-m-vertical_large">
								 
							</div>
							<div class="slds-grid slds-wrap slds-m-vertical_large">
								 
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1 slds-m-bottom_medium">
								<lightning-input type="number" formatter="currency" label="Monthly total for Contact Center" value={dealQuoteInfo.Monthly_total_for_Contact_Center__c} data-id="Monthly_total_for_Contact_Center__c" onchange={inputChangeEvent} step="0.01"></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-input type="number" formatter="currency" label="Monthly total for phone rentals" value={dealQuoteInfo.Monthly_total_for_phone_rentals__c} data-id="Monthly_total_for_phone_rentals__c" onchange={inputChangeEvent} step="0.01"></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-input type="number" formatter="currency" label="Monthly total for RCO Enterprise Support" value={dealQuoteInfo.Monthly_total_for_ProServ_Enterprise__c} data-id="Monthly_total_for_ProServ_Enterprise__c" onchange={inputChangeEvent} step="0.01"></lightning-input>
							</div>
							<div class="slds-form-element slds-form-element_horizontal-1">
								<lightning-input type="number" formatter="currency" label="Monthly total for all other recurring charges (no fees)" value={dealQuoteInfo.Monthly_total_for_all_other_recurring_ch__c} data-id="Monthly_total_for_all_other_recurring_ch__c" onchange={inputChangeEvent} step="0.01"></lightning-input>
							</div>
						</div>
					</div>
				</div>
			</lightning-card>
			<lightning-card>

											<lightning-input class="slds-text-align_center custom-center-align" type="number" step="0.01" label="Recommended Discount %" variant="label-hidden" value={dealQuoteInfo.Recommended_Discount_vs_list__c} data-id="Recommended_Discount_vs_list__c" onchange={inputChangeEvent} disabled="true"></lightning-input>
										</div>
									</div>
									<div class="slds-form-element slds-form-element_horizontal-1" if:true={FALSE_CONST}>
										<lightning-input class="slds-text-align_center custom-center-align" type="number" step="0.01" label="Recommended price per Limited Extension after discounts" value={dealQuoteInfo.Recommended_price_per_Limited_Extension__c} data-id="Recommended_price_per_Limited_Extension__c" onchange={inputChangeEvent} disabled="true"></lightning-input>

									<div class="slds-form-element slds-form-element_horizontal-1" if:true={FALSE_CONST}>

									</div>

						<div class="slds-col slds-size_4-of-12 slds-m-left_small">

											<div class='border-blue'>
												Your price for Unlimited DLs
											</div>
										</div>
									</div>
									<div class="slds-grid">
										<div class="slds-col slds-size_3-of-12 slds-m-horizontal_xx-small"> 
											<label class="slds-form-element__label label-align-center" for="unique-id-of-input">Per unit ($)</label>
