<template>
    <div class="container">

        <div class="tabs-container">
            <template for:each={tabsToDisplay} for:item="t">
                <div key={t.index} class={t.class} 
                     onclick={activateTab} data-tab={t.index}>
                    {t.label} <!-- Capitalize the tab name -->
                </div>
            </template>
        </div>
        <div class="tab-content">
            <template if:true={tabs.quotes}>
                <c-quote-metrics-dashboard></c-quote-metrics-dashboard>
            </template>
            <template if:true={tabs.cases}>
                <c-case-rate-statistic></c-case-rate-statistic>
            </template>
        </div>
    </div>
    
</template>
