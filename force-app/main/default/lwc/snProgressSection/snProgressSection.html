<template>
    <div class={liFirstClasses}>
        <div if:true={isCompleted}
             class="slds-icon_container slds-icon-utility-success slds-progress__marker
                     slds-progress__marker_icon slds-progress__marker_icon-success pointer-icon-top"
             title="Complete">
            <lightning-icon icon-name="utility:success"
                            alternative-text="Success"
                            variant="success"
                            size="x-small"
                            class="mark-success">
            </lightning-icon>
            <span class="slds-assistive-text">Complete</span>
        </div>
        <div if:false={isCompleted}
             class="slds-progress__marker progress-marker">
            <span class="slds-assistive-text">Active</span>
        </div>
        <div class={lineClasses}></div>
        <div class="slds-progress__item_content progress-content-top slds-scrollable_x">
            <span class={stepHeaderTextClasses}>{header}</span>
            <slot></slot>
        </div>
    </div>
</template>
