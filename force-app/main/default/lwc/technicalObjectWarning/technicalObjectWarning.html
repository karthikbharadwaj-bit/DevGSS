<template>
    <div class="showSpinner" if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
    </div>
    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error" role="status">
        <div class="slds-media__figure">
          <lightning-icon variant="inverse" icon-name="utility:error" alternative-text="Error!" size="small"></lightning-icon>
        </div>
        <div class="slds-media__body">
            <p>This is a Technical {objectApiName}. Please don't modify it. If you need to make any changes, use <a target="_blank" href={url}>Master {objectApiName}</a></p>
        </div>
    </div>
</template>
