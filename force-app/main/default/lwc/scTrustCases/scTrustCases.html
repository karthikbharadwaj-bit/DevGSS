<template>
    <ol data-empty={labels.empty}>
        <template if:true={isLoaded}>
            <template for:each={cases} for:item="item">
                <li key={item.uid} data-id={item.uid}>
                    <c-sc-trust-case
                        inx={item.Id}
                        title={item.title}
                        url={item.caseLink}
                        number={item.caseNumber}
                        type={item.type}
                        details={item.details}
                        status={item.status}
                        modify={item.modify}
                        labels={labels}
                    ></c-sc-trust-case>
                </li>
            </template>
        </template>
    </ol>
</template>
