<template>
    <ul class={paginationCls}>
        <li class={arrowLeftCls} data-id="prev" onclick={handleChangePage}>
            <lightning-icon
                icon-name="utility:chevronleft"
                alternative-text="&lt;"
                title="Previous page"
                size="x-small"
            ></lightning-icon>
        </li>
        <template for:each={pages} for:item="item">
            <li key={item.id} data-id={item.id} class={item.pageCls} onclick={handleChangePage}>{item.id}</li>
        </template>
        <li class={arrowRightCls} data-id="next" onclick={handleChangePage}>
            <lightning-icon
                icon-name="utility:chevronright"
                alternative-text="&gt;"
                title="Next page"
                size="x-small"
            ></lightning-icon>
        </li>
    </ul>
</template>
