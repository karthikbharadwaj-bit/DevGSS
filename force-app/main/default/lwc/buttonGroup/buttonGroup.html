<template>
    <fieldset class="slds-form-element" if:true={hasItems} style="margin-left:20px">
        <legend class="slds-form-element__legend slds-form-element__label">{title}</legend>
        <div class="slds-form-element__control">
            <div class="slds-checkbox_button-group">
                <template for:each={items} for:item="item">
                    <span class="slds-button slds-checkbox_button" key={item.value} onclick={handleChangeValue} data-id={item.value}>
                        <label class="slds-checkbox_button__label">
                            <span class="slds-checkbox_faux">{item.label}</span>
                        </label>
                    </span>
                </template>
            </div>
        </div>
    </fieldset>
</template>
