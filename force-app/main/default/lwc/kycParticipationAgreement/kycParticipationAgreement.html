<!-- Participation Agreement -->
<template>
    <div class="slds-grid slds-gutters slds-wrap">
        <div class="slds-col slds-size_6-of-12">
            <span>
                <lightning-input type="date"
                                 label="Date of Sign off"
                                 placeholder="Enter date"
                                 class="dateOfSign"
                                 value={dateOfSign}
                                 data-id="dateOfSign"
                                 onchange={onChange}
                                 disabled={isDateOfSignDisable}>
                </lightning-input>
            </span>
        </div>
    </div>
</template>
