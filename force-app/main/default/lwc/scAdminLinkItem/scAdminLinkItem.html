<template>
    <a class="slds-app-launcher__tile slds-text-link_reset" href={link} target="_blank">
        <div class="slds-app-launcher__tile-figure">
            <span class="slds-avatar slds-avatar_large">
                <lightning-icon icon-name={icon} alternative-text={title}></lightning-icon>
            </span>
        </div>
        <div class="slds-app-launcher__tile-body">
            <h2 class="slds-text-heading_small">{title}</h2>
            <p class="slds-app-launcher__details">{description}</p>
        </div>
    </a>
</template>
