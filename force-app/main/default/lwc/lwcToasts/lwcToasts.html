<template>
    <div class={mainClass}>
        <div class={statusClass} role="status">
            <lightning-icon icon-name={iconName}
                            data-ui-auto="type-icon-name"
                            alternative-text={iconText}
                            class="slds-m-right_small slds-no-flex slds-align-top"
                            size="small"
                            variant="inverse"></lightning-icon>
            <div class="slds-notify__content">
                <h2 class="slds-text-heading_small" data-ui-auto="show-toast-title">
                    <p>{title}</p>
                </h2>
                <div class="message-content" data-ui-auto="show-toast-message" lwc:dom="manual"></div>
            </div>
            <div class="slds-notify__close">
                <lightning-button-icon icon-name="utility:close"
                                       data-ui-auto="close-icon"
                                       alternative-text="Close"
                                       size="large"
                                       onclick={close}
                                       variant="bare-inverse"></lightning-button-icon>
            </div>
        </div>
    </div>
</template>
