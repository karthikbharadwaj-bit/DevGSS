<template>
    <!-- LDS Warning Banner -->
    <template if:true={hasOpenChild}>
        <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning slds-grid slds-grid_align-start">
            <span class="slds-icon_container slds-icon-utility-warning slds-m-right_small slds-no-flex" title="Warning">
                <lightning-icon icon-name="utility:warning" alternative-text="Warning" size="Large"></lightning-icon>
                        <span class="slds-assistive-text">Warning</span>
                    </span>
            <div class="slds-col slds-align-spread">
             <p><strong>Please handle with care. This case has been escalated.</strong></p>
             <p>This case has been escalated by MOD {modRecordCreator}. Please reference <strong><a href={modRecordUrl} target="_blank">{modName}</a></strong> for more details.</p>  
        </div>
        </div>
    </template>
</template>
