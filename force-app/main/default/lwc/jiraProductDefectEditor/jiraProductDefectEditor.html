<template>
    <header class="slds-modal__header">
        <h2 class="slds-modal__title slds-hyphenate">Product Defect</h2>
    </header>

    <div class="slds-modal__content slds-p-around_medium">
        <template if:true={isLoadingAccess}>
            <div class="slds-is-relative slds-p-vertical_medium">
                <lightning-spinner size="small" alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoadingAccess}>
            <template if:true={showWarning}>
                <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Warning</span>
                    <h2>{warningMessage}</h2>
                </div>
            </template>

            <lightning-record-edit-form
                object-api-name="Case"
                record-id={recordId}
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}>
                <lightning-messages></lightning-messages>

                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name="Jira__c"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input-field field-name="Jira_Case__c"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-input-field field-name="Jira_Link__c"></lightning-input-field>
                    </div>
                </div>

                <footer class="slds-modal__footer slds-grid slds-grid_align-end slds-p-top_medium">
                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        onclick={handleCancel}
                        disabled={isBusy}>
                    </lightning-button>
                    <lightning-button
                        type="submit"
                        label="Save"
                        variant="brand"
                        class="slds-m-left_small"
                        disabled={isBusy}>
                    </lightning-button>
                </footer>
            </lightning-record-edit-form>
        </template>
    </div>
</template>
