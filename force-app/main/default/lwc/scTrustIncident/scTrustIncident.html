<template>
    <div class="left-description">
        <h2>{title}</h2>
    </div>
    <div class="right-description-block">
        <h2 class="right-title">Status update</h2>
        <div class="right-description">
            <template for:each={incidents} for:item="item">
                <p key={item.uid}>
                    <span><b>{item.dateForIncident}</b><br />{item.timeForIncident}</span>
                    <span>{item.description}</span>
                </p>
            </template>
        </div>
    </div>
</template>
