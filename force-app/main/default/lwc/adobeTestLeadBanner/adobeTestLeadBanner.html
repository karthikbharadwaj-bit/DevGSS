<template>
  <div class="bannerStyle slds-grid slds-wrap" role="alert" if:true={isAdobeTest}>
    <div class="slds-size_4-of-12 slds-col slds-m-top_x-small slds-m-bottom_x-small">
        <span class="slds-assistive-text">warning</span>
        <span class="slds-icon_container slds-m-left_x-small" title="This is a adobe test Lead">
          <lightning-icon icon-name="utility:warning" alternative-text="Warning!" variant="error"></lightning-icon>
          <b class="noteFont slds-m-left_x-small" >{textMessage}</b> 
        </span>
    </div>                                                                                                                                                                                                                         
    <div class= "slds-size_8-of-12 slds-col slds-m-top_x-small slds-m-bottom_x-small"> 
      <p class="infoFont"> {adobeDescription}</p>
    </div>
  </div>
</template>
