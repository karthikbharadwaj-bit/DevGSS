<template>
    <template if:true={loading}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>
    <c-sc-admin-header
        onlanguagechange={changeLang}
        rows={rowCount}
        changed={changed}
        onrowchange={changeRow}
        oncancel={onCancel}
        onsave={saveTopics}
        onreset={onReset}
        lang={lang}></c-sc-admin-header>
    <div class="slds-grid slds-gutters">
            <c-sc-admin-search
                class="slds-col"
                custom={custom}
                oncdragend={dragEnd}
                oncdragstart={dragStart}
                onhighlightstart={highlightStart}
                onhighlightend={highlightEnd}
                highlight={highlight}
                domain={domain}
                lang={lang}></c-sc-admin-search>
            <c-sc-admin-out
                class="slds-col"
                onoutchange={changeOut}
                rows={rowCount}
                coveo={coveo}
                custom={custom}
                onhighlightstart={highlightStart}
                onhighlightend={highlightEnd}
                highlight={highlight}
                domain={domain}
                drag={drag}></c-sc-admin-out>
            <c-sc-admin-coveo
                class="slds-col"
                coveo={coveo}
                onhighlightstart={highlightStart}
                onhighlightend={highlightEnd}
                highlight={highlight}></c-sc-admin-coveo>
    </div>
    <c-sc-admin-links class="navigation"></c-sc-admin-links>
    <c-lwc-toasts></c-lwc-toasts>
</template>
