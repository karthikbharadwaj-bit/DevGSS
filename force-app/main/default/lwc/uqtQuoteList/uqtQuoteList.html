<template>
    <c-lwc-spinner></c-lwc-spinner>
    <c-lwc-toasts></c-lwc-toasts>

    <div class={containerClass}>
        <template for:each={quotesGroups} for:item="group">
            <div class="slds-col" key={group.recordTypeName}>
                <article
                    class={articleClass}
                    data-ui-auto={group.groupDataUiAuto}
                >
                    <!-- Group Header -->
                    <div class="slds-grid slds-border_bottom">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate slds-grid slds-grid_align-spread slds-p-horizontal_medium">
                        <!-- Quote group name -->
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">
                            <span class="slds-card__header-link slds-truncate" title="group.recordTypeName">
                                <span>{group.groupName}</span>
                            </span>
                            </h2>
                            <button
                                if:true={group.isPOCsectionInPOCtoPaid}
                                disabled
                                class="slds-button slds-button_icon slds-p-left_small"
                            >
                                <lightning-icon
                                    icon-name="utility:info"
                                    size="x-small"
                                >
                                </lightning-icon>
                                <div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-right poc-to-paid-icon">
                                    <div class="slds-popover__body">{TOOLTIP_MESSAGES.POC_TO_PAID}</div>
                                </div>
                            </button>
                        </div>
                        <!-- Add New Button -->
                        <div>
                            <button
                                if:true={group.isAddNewButtonVisible}
                                class="slds-button slds-button_brand"
                                onclick={onCreate}
                                data-recordtype={group.recordTypeName}
                                data-ui-auto="add-new-quote"
                                disabled={group.isAddNewButtonDisabled}
                            >
                            {ADD_NEW_BUTTON}
                            <div class="slds-popover slds-popover_tooltip slds-nubbin_right tooltip-left">
                                <div class="slds-popover__body">{readOnly}</div>
                            </div>
                            </button>
                        </div>
                        </header>
                    </div>
                    <!-- Group Body -->
                    <div class="slds-card__body slds-card__body_inner" >
                        <div class="slds-grid slds-grid_align-center">
                            <!-- Initiate ProServ Button -->
                            <template if:true={group.isInitiateProServButtonVisible}>
                                <div class="slds-m-around_medium">
                                    <button
                                        class="slds-button slds-button_brand slds-align_absolute-center"
                                        data-recordtype={group.recordTypeName}
                                        data-ui-auto="initiate-proserv"
                                        data-id="initiate-proserv"
                                        onclick={openModal}
                                    >
                                    {INITIATE_PROSERV_BUTTON}
                                    <div class="slds-popover slds-popover_tooltip slds-nubbin_right tooltip-left">
                                        <div class="slds-popover__body">{readOnly}</div>
                                    </div>
                                    </button>
                                </div>
                            </template>
                            <!-- Initiate CC ProServ Button -->
                            <template if:true={group.isInitiateCCProServButtonVisible}>
                                <div class="slds-m-vertical_medium">
                                    <button
                                        class="slds-button slds-button_brand slds-align_absolute-center"
                                        data-recordtype={group.recordTypeName}
                                        data-ui-auto="initiate-cc-proserv"
                                        data-id="initiate-cc-proserv"
                                        onclick={openModal}
                                    >
                                    {INITIATE_CC_PROSERV_BUTTON}
                                    <div class="slds-popover slds-popover_tooltip slds-nubbin_right tooltip-left">
                                        <div class="slds-popover__body">{readOnly}</div>
                                    </div>
                                    </button>
                                </div>
                            </template>
                        </div>
                        <!-- Quotes List -->
                        <template if:true={group.quotes.length}>
                            <div>
                                <template for:each={group.quotes} for:item="quote">
                                    <div
                                        key={quote.Id}
                                        class="slds-grid slds-grid_align-spread slds-p-vertical_x-small slds-p-horizontal_medium quote"
                                        data-ui-quote-id={quote.Id}
                                    >
                                        <!-- Quote Name and Primary Quote Star -->
                                        <div
                                            class="slds-grid slds-grid_vertical-align-center quote-name-block"
                                            data-isdisabled={group.isPOCsectionInPOCtoPaid}
                                        >
                                            <template if:true={quote.isPrimary__c}>
                                                <lightning-icon
                                                    class="slds-button__icon slds-m-right_small primary-icon"
                                                    icon-name="utility:favorite"
                                                    size="xx-small"
                                                ></lightning-icon>
                                            </template>
                                            <template lwc:if={group.isQuoteLinkBlocked}>
                                                <a
                                                    class="slds-truncate disabled-links"
                                                    title={quote.Name}
                                                >
                                                    {quote.Name}
                                                </a>
                                            </template>
                                            <template lwc:else>
                                                <a
                                                    class="slds-truncate"
                                                    title={quote.Name}
                                                    href={quote.url}
                                                    target="_blank"
                                                >
                                                    {quote.Name}
                                                </a>
                                            </template>
                                        </div>
                                        <div class="slds-grid slds-grid_vertical-align-center slds-p-left_x-small">
                                        <!-- Make Primary Button -->
                                        <button
                                            class="slds-button slds-button_neutral slds-grid"
                                            data-ui-auto="make-primary-quote"
                                            data-quoteid={quote.Id}
                                            data-recordtype={group.recordTypeName}
                                            onclick={onMakePrimary}
                                            disabled={quote.buttonsDisabled.primary}
                                            title={quote.buttonsDisabled.primary}
                                        >
                                            <lightning-icon
                                                class="slds-m-horizontal_x-small icons-blue"
                                                icon-name="utility:favorite"
                                                size="xx-small"
                                            ></lightning-icon>
                                            <span class="slds-m-right_x-small">{QUOTE_ACTION_BUTTONS.MAKE_PRIMARY}</span>
                                        </button>
                                        <!-- Copy Button -->
                                        <button
                                            class="slds-button slds-button_neutral slds-grid"
                                            data-ui-auto="copy-quote"
                                            data-quoteid={quote.Id}
                                            data-recordtype={group.recordTypeName}
                                            onclick={onCopy}
                                            disabled={quote.buttonsDisabled.copy}
                                            title={quote.buttonsDisabled.copy}
                                        >
                                            <lightning-icon
                                                class="slds-m-horizontal_x-small icons-blue"
                                                icon-name="utility:copy"
                                                size="xx-small"
                                            ></lightning-icon>
                                            <span class="slds-m-right_x-small">{QUOTE_ACTION_BUTTONS.COPY}</span>
                                        </button>
                                        <!-- Delete Button -->
                                        <button
                                            class="slds-button slds-button_neutral"
                                            data-ui-auto="delete-quote"
                                            data-quoteid={quote.Id}
                                            data-recordtype={group.recordTypeName}
                                            onclick={onDelete}
                                            disabled={quote.buttonsDisabled.delete}
                                            title={quote.buttonsDisabled.delete}
                                        >
                                            <lightning-icon
                                                class="slds-m-horizontal_x-small icons-blue"
                                                icon-name="utility:delete"
                                                size="xx-small"
                                            ></lightning-icon>
                                            <span class="slds-m-right_x-small">{QUOTE_ACTION_BUTTONS.DELETE}</span>
                                        </button>

                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <!-- Empty quotes list text -->
                        <template if:true={group.showNoQuotesFound}>
                            <p class="slds-text-color_weak">No {group.recordTypeName}s found</p>
                        </template>
                    </div>
                </article>
            </div>
        </template>

    </div>
    <template if:true={isModalOpen}>
        <div class={backdrop}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" 
                            onclick={closeModal}>
                            <lightning-icon icon-name="utility:close"
                                alternative-text="close"
                                variant="inverse"
                                size="small">
                            </lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>

                        <h2 class="slds-text-heading_medium slds-hyphenate black-font">
                            Initiate Professional Services
                        </h2>
                    </div>

                    <div class="slds-modal--medium">

                        <!-- Modal Body -->
                        <div class="slds-modal__content slds-p-around_medium">

                            <lightning-checkbox-group
                                label="Please select all of the following options that apply to your request:"
                                options={caseReasons}
                                value={selectedCaseReasons}
                                onchange={selectCaseReason}>
                            </lightning-checkbox-group>
                        </div>

                        <footer class="slds-modal__footer">
                            <lightning-button label="Cancel" onclick={closeModal} class="slds-m-right_x-small"></lightning-button>
                            <lightning-button variant="brand" label="Submit" onclick={engageProServProcess}></lightning-button>
                        </footer>
                    </div>
                </div>
            </section>
        </div>
    </template>
</template>
