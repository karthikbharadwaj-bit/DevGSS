<template>
    <div class={containerClass}>
        <div class="slds-col slds-m-right_medium input1">
            <lightning-input
                data-id="address1"
                type="text"
                name="address1"
                label="Address 1"
                required
                value={address1}
                disabled={generalInfoDisabled}
                placeholder="Enter address"
                onchange={handleAddressValue1}
                onblur={checkValidity}></lightning-input>
        </div>
        <div class="slds-col slds-m-right_medium input2">
            <lightning-input
                data-id="address2"
                type="text"
                name="address2"
                label="Address 2"
                value={address2}
                disabled={generalInfoDisabled}
                onchange={handleAddressValue2}></lightning-input>
        </div>
        <div class="slds-col slds-m-right_medium input2">
            <lightning-combobox
                data-id="country"
                name="Country"
                label="Country"
                value={country}
                dropdown-alignment="auto"
                options={countryOptions}
                placeholder={countryLoadingPlaceholder}
                required
                disabled={disabledCountries}
                onchange={handleCountryValue}
                onblur={checkValidity}></lightning-combobox>
        </div>
        <div class="slds-col slds-m-right_medium input2">
            <lightning-combobox
                data-id="state"
                name="StateProvinceCounty"
                label="State"
                value={state}
                placeholder={statePlaceholder}
                dropdown-alignment="auto"
                options={stateOptions}
                required={isStatesNotEmpty}
                disabled={disabledStates}
                onchange={handleStateValue}
                onblur={checkValidity}></lightning-combobox>
        </div>
        <div class="slds-col slds-m-right_medium input2">
            <lightning-input
                data-id="city"
                label="City"
                value={city}
                required
                placeholder="Enter city"
                disabled={generalInfoDisabled}
                onchange={handleCityValue}
                onblur={checkValidity}></lightning-input>
        </div>
        <div class="slds-col slds-m-right_medium input2">
            <lightning-input
                data-id="zip"
                label="ZIP"
                value={zip}
                required
                placeholder="Enter ZIP"
                disabled={generalInfoDisabled}
                onchange={handleZipValue}
                onblur={checkValidity}></lightning-input>
        </div>
        <div class="slds-col input3">
            <button 
                class="slds-button slds-button_brand" 
                data-ui-auto="validate-button"
                disabled={disableValidateButton} 
                onclick={onValidate}>Validate</button>
        </div>
    </div>
</template>
