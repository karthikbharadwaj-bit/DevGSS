<template>
    <template if:true={doNotContact}>
        <lightning-card>
            <div class="slds-box slds-theme_default slds-m-around_medium" style="background-color: #FFFFE0;">
                <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="utility:error"
                            alternative-text="Warning!"
                            variant="error"
                        ></lightning-icon>
                    </div>
                    <p>
                        <strong>DO NOT CONTACT THIS PROSPECT : </strong>The partner has requested to no longer contacted via phone call, email and SMS
                        <template if:true={partAccountName}>
                            , please reach out to <a href={partAccountUrl}>{partAccountName}</a>.
                        </template>
                    </p>    
                </div>
            </div>
        </lightning-card>
    </template>
</template>
