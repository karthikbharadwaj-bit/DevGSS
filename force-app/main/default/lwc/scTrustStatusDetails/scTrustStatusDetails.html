<template>
    <div class="sc-trust-description">
        <span class="good">{label.SC_good}</span>
        <span class="info">{label.SC_information}</span>
        <span class="warn">{label.SC_warning}</span>
        <span class="err">{label.SC_error}</span>
    </div>
    <div class="sc-trust-details">
        <ul class="sc-trust-details__list">
            <template for:each={col_1} for:item="item">
                <li key={item.uid}>
                    <c-sc-trust-status-item
                        status={item.status}
                        title={item.title}
                        childrens={item.children}
                        side="left"
                    ></c-sc-trust-status-item>
                </li>
            </template>
        </ul>
        <ul class="sc-trust-details__list">
            <template for:each={col_2} for:item="item">
                <li key={item.uid}>
                    <c-sc-trust-status-item
                        status={item.status}
                        title={item.title}
                        childrens={item.children}
                        side="right"
                    ></c-sc-trust-status-item>
                </li>
            </template>
        </ul>
    </div>
</template>
