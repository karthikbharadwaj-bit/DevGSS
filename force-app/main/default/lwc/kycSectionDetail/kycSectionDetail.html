<template>
    <div class="file-section">
        <div>
            <lightning-icon if:false={isHasId}
                            icon-name={fileIcon}
                            class="icon"
                            size="large">

            </lightning-icon>
            <img if:true={isHasId} src={imageSrc} class="thumbnailImg" data-id="file"/>
        </div>
        <div class="slds-text-align_center slds-text-title slds-text-color_weak">
            <b title={title}>{name}</b>
        </div>

        <div class="flex-container">
            <div class="order-0"></div>
            <div class="order-1"><hr class="separator"></div>
            <div class="order-2"></div>
            <div class="order-3"></div>
            <div class="order-4 slds-text-title slds-text-color_weak"><b>File size:</b>
                <span class="slds-text-title slds-text-color_weak file-size-block">{fileSize}</span>
            </div>
            <div class="order-5"></div>
            <div class="order-6">
                <lightning-button-icon if:true={isHasId}
                    icon-name="utility:download"
                    variant="bare"
                    alternative-text="download"
                    class="slds-button__icon"
                    onclick={onDownLoadClick}>
                </lightning-button-icon>
            </div>
            <div class="order-7">
                <lightning-button-icon if:false={isFormLocked}
                    icon-name="utility:delete"
                    variant="bare"
                    alternative-text="delete"
                    class="slds-button__icon"
                    onclick={onDeleteClick}>
                </lightning-button-icon>
            </div>
            <div class="order-8"></div>
        </div>
    </div>
</template>
