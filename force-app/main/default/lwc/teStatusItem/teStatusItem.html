<template>
    <div class="slds-grid slds-gutters slds-p-horizontal_small">
        <div class={statusSLDSClass}>
            <div class="slds-truncate">{option}</div>
        </div>

        <template if:true={isShowUSTaxExemption}>
        <div class={taxSLDSClass}>
            <lightning-input
                type="checkbox"
                name={IsFederalExemption}
                disabled={isFederalDisabled}
                checked={isFederalExemption}
                onchange={onFederalExemptionChange}>
            </lightning-input>
        </div>

        <div class={taxSLDSClass}>
            <lightning-input
                type="checkbox"
                name={IsStateExemption}
                disabled={isStateDisabled}
                checked={isStateExemption}
                onchange={onStateExemptionChange}>
            </lightning-input>
        </div>

        <div class={taxSLDSClass}>
            <lightning-input
                type="checkbox"
                name={IsCountyExemption}
                disabled={isCountyDisabled}
                checked={isCountyExemption}
                onchange={onCountyExemptionChange}>
            </lightning-input>
        </div>

        <div class={taxSLDSClass}>
            <lightning-input
                type="checkbox"
                name={IsLocalExemption}
                disabled={isLocalDisabled}
                checked={isLocalExemption}
                onchange={onLocalExemptionChange}>
            </lightning-input>
        </div>

        <div if:true={isShowSalesTaxExemption} class={taxSLDSClass}>
            <lightning-input
                type="checkbox"
                name={IsSalesExemption}
                disabled={isSalesDisabled}
                checked={isSalesExemption}
                onchange={onSalesExemptionChange}>
            </lightning-input>
        </div>
        </template>
        <template if:true={isShowVATTaxExemption}>
            <div class="slds-col slds-size_2-of-12 slds-p-top_small">
                <lightning-input
                    type="checkbox"
                    name={IsVatExemption}
                    disabled={isVatDisabled}
                    checked={isVatExemption}
                    onchange={onVatExemptionChange}>
                </lightning-input>
            </div>
        </template>
        <template if:true={isShowIndianTaxExemption}>
            <div class="slds-col slds-size_2-of-12 slds-p-top_small">
                <lightning-input
                    type="checkbox"
                    name="indian-tax-ex"
                    disabled={isIndianDisabled}
                    checked={isIndianExemption}
                    onchange={onIndianExemptionChange}>
                </lightning-input>
            </div>
        </template>
    </div>
</template>
