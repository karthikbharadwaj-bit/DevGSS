<template>
    <div class={sectionClasses}>
        <div class="slds-progress slds-progress_vertical">
            <div class="slds-progress slds-progress_vertical">
                <c-sn-progress-section header="Preparing Data" status={firstStepSetting}>
                    <div class="slds-m-top_x-small disabled-step text-step" data-ui-auto="contact-center-step">{step}</div>
                </c-sn-progress-section>
            </div>
            <c-sn-progress-section table header="Add General Information" status={secondStepSetting}>
                <div class="slds-m-bottom_xx-small slds-m-top_x-small title">Case Provisioning Parameters</div>
                <div class="slds-grid slds-grid_vertical-align-start slds-p-bottom_x-small">
                    <div class="slds-col slds-m-right_medium set-width">
                        <c-searchable-dropdown 
                            combobox-options={timezones}
                            slds-modal-el={sldsModalEl}
                            disabled={generalOrDisabledWhenExistingBusiness}
                            selected-value={timezoneValue}
                            label="Timezone"
                            required
                            onchange={handleTimezone}>
                        </c-searchable-dropdown>
                    </div>
                    <div class="slds-col slds-m-right_medium set-width">
                        <lightning-combobox
                            name="geoRegion"
                            data-id="geoRegion"
                            label="Geo Region"
                            value={geoRegion}
                            required
                            placeholder="Select region"
                            dropdown-alignment="auto"
                            options={geoRegions}
                            onchange={handleGeoRegion}
                            disabled={generalOrDisabledWhenExistingBusiness}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-m-right_medium set-width">
                        <lightning-combobox
                            name="implementationTeam"
                            data-id="implementationTeam"
                            label="Implementation Team"
                            value={implementationTeam}
                            required
                            placeholder="Select implementation team"
                            dropdown-alignment="auto"
                            options={implementationTeams}
                            onchange={handleImplementationTeam}
                            disabled={isGeneralInfoDisabled}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-m-right_medium set-width">
                        <lightning-combobox
                            name="inContactSegment"
                            data-id="inContactSegment"
                            label="InContact Segment"
                            value={inContactSegment}
                            required
                            placeholder="Select segment"
                            dropdown-alignment="auto"
                            options={inContactSegments}
                            onchange={handleInContactSegment}
                            disabled={isGeneralInfoDisabled}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-m-right_x-small set-width">
                        <lightning-input
                            type="tel"
                            name="ccNumber"
                            data-id="ccNumber"
                            label="CC Number"
                            value={ccNumber}
                            required
                            placeholder="Enter CC number"
                            onchange={handleCCNumber}
                            pattern="\+?\d+"
                            disabled={generalOrDisabledWhenExistingBusiness}
                        ></lightning-input>
                    </div>
                </div>
                <c-sn-order-to-vendor-table
                    class={tableVisibility}
                    disabled-general-info={isGeneralInfoDisabled}
                    onbodyheight={onBodyHeightChanged}
                    onpassniclicensesitems={populateNicLicensesItems}
                    opportunity-id={opportunityId}
                    existing={existing}
                    is-ready-for-get-order-to-vendor-catalog={isReadyForGetOrderToVendorCatalog}>
                </c-sn-order-to-vendor-table>
                <div class="slds-m-right_x-small slds-m-bottom_xx-small slds-m-top_x-small">
                    <label class="slds-form-element__label" for="quoteDescriptionTextArea">Description</label>
                    <textarea
                        id="quoteDescriptionTextArea"
                        class={textareaStyle}
                        readonly={isGeneralInfoDisabled}
                        onchange={handleQuoteDescriptionChange}>{quoteDescription}</textarea>
                </div>
            </c-sn-progress-section>
        </div>
        <div if:true={isShowAddressValidation} class="slds-progress slds-progress_vertical">
            <c-sn-progress-section header="Add Address Validation" status={thirdStepSetting}>
                <c-sn-address-section
                    disable-general-fields={isContactCenterFieldsEmpty}
                    suggested-address={suggestedAddress}
                    service-signed-up={isSignedUp}
                    enable-validate-button={enableValidateButton}
                    countries={countriesToMatch}>
                </c-sn-address-section>
            </c-sn-progress-section>
        </div>
        <div class="slds-progress slds-progress_vertical">
            <c-sn-progress-section header={header} status={lastStepSetting} last>
                <div if:false={isStartedSignUp} class="slds-m-vertical_xx-small text-step">Not started</div>
                <div if:true={isShowSyncInfo} class="slds-m-top_x-small text-step text-step sync-info">
                    <lightning-formatted-date-time
                        value={timing}
                        year="numeric"
                        month="numeric"
                        day="numeric"
                        hour="2-digit"
                        minute="2-digit"
                        time-zone={currentUserTimeZone}
                    ></lightning-formatted-date-time> <span> Initiated by {currentUser}</span>
                </div>
            </c-sn-progress-section>
        </div>
    </div>
</template>
