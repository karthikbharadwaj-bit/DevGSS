<template>
    <template for:each={incidents} for:item="item">
        <c-sc-trust-incident-tab
            key={item.inx}
            incidents={item.incidents}
            inx={item.inx}
            data-id={item.inx}
            data-open={item.isOpen}
            onclick={handleIncidentClick}
            class={item.rowCls}
        ></c-sc-trust-incident-tab>
        <c-sc-trust-incident incidents={item.incidents} key={item.inx}></c-sc-trust-incident>
    </template>
</template>
